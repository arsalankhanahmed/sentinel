name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: backend/go.mod }
      - run: go mod tidy
      - run: go vet ./...
      - name: go test
        run: |
          set -o pipefail
          # only packages that have tests (avoids the 'covdata' tool on test-less packages)
          PKGS=$(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          go test -race -count=1 -coverprofile=coverage.out $PKGS 2>&1 | tee test-output.txt
      - name: Report failures as annotations
        if: failure()
        run: |
          { grep -E "^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:" test-output.txt || true; tail -n 25 test-output.txt; } | head -60 | sed 's/^/::error::/'
      - run: go tool cover -func=coverage.out | tail -1

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build

  e2e:
    name: Playwright E2E (full demo stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose -f docker-compose.demo.yml up --build -d
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: tests/e2e
        env:
          SENTINEL_URL: http://localhost:8080
          MOCK_URL: http://localhost:9911
          MOCK_URL_FROM_SENTINEL: http://mock-webhook:9911
          DEMO_DSN: postgres://sentinel_ro:sentinel_ro@appdb:5432/erp?sslmode=disable
        run: npx playwright test --project=api --project=ui-desktop --project=ui-mobile
      - name: k6 smoke load test
        uses: grafana/k6-action@v0.3.1
        with: { filename: tests/load/k6-api.js }
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=200
